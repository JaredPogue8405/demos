<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Loop Status — live</title>
<meta name="description" content="Live status of the autonomous build loop — what's done, running, next, and what needs you." />
<meta name="theme-color" content="#08110e" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2308110e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%2340e0a0' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%2340e0a0'/%3E%3C/svg%3E" />
<style>
  /* ============================================================
     LOOP STATUS — the glanceable dashboard. Its own identity:
     a calm ops-console (deep teal-black, mint "alive" accent),
     NOT Fusion. Self-contained, phone-first, auto-refreshing.
     Reads loop-status.json (the loop rewrites it every cycle).
     ============================================================ */
  :root{
    --bg:#08110e; --bg2:#0c1814; --card:#101f18; --card2:#132720; --line:#20362c;
    --text:#e8f3ee; --muted:#8ba79a; --faint:#5c7568;
    --mint:#40e0a0; --mint-bright:#6bf0bd; --amber:#f0c33c; --blue:#63b3ff; --rose:#ff7a8a;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(900px 520px at 50% -12%,#10221b,var(--bg) 62%);color:var(--text);
    font-family:var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased;line-height:1.5}
  :focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:6px}
  .wrap{max-width:680px;margin:0 auto;padding:22px 16px calc(60px + env(safe-area-inset-bottom))}

  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .pulse{width:12px;height:12px;border-radius:50%;background:var(--mint);flex:none;box-shadow:0 0 0 0 rgba(64,224,160,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(64,224,160,.5)}70%{box-shadow:0 0 0 12px rgba(64,224,160,0)}100%{box-shadow:0 0 0 0 rgba(64,224,160,0)}}
  h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
  h1 span{color:var(--mint)}
  .updated{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right}
  .updated b{color:var(--muted);display:block;font-weight:400}

  .now{margin-top:16px;background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
    border-left:3px solid var(--mint);border-radius:14px;padding:15px 17px}
  .now .lab{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mint)}
  .now .txt{font-size:15.5px;font-weight:600;margin-top:5px}
  .now .nxt{font-size:13px;color:var(--muted);margin-top:8px}
  .now .nxt b{color:var(--text);font-weight:600}

  .row{display:flex;gap:10px;margin-top:12px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
  .stat b{display:block;font-size:26px;font-weight:800;color:var(--mint-bright);font-variant-numeric:tabular-nums}
  .stat span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

  .seclabel{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    margin:24px 0 10px;display:flex;align-items:center;gap:10px}
  .seclabel::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  .feed{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .item .k{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:15px}
  .item .k.fix{background:rgba(240,195,60,.14)} .item .k.feat{background:rgba(64,224,160,.14)}
  .item .k.deploy{background:rgba(99,179,255,.14)} .item .k.audit{background:rgba(139,167,154,.14)}
  .item .body{min-width:0;flex:1}
  .item .body b{font-size:14px;font-weight:600;display:block}
  .item .body .meta{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px}
  .item .body .meta a{color:var(--blue);text-decoration:none}

  .need{background:rgba(240,195,60,.06);border:1px solid rgba(240,195,60,.28);border-radius:12px;padding:11px 14px;margin-bottom:8px;
    display:flex;gap:10px;align-items:flex-start}
  .need .dot{color:var(--amber);flex:none;margin-top:1px}
  .need b{color:#f2d67e;font-weight:600;font-size:13.5px}
  .need span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}

  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
  .links a{font-size:12.5px;font-weight:600;color:var(--mint);text-decoration:none;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:9px 15px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
  footer{margin-top:26px;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--faint);line-height:1.9}
  .err{color:var(--rose);font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:16px}
  @media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="pulse" id="pulse" aria-hidden="true"></span>
    <h1>Loop <span>Status</span></h1>
    <div class="updated"><b>Updated</b><span id="updated">—</span></div>
  </header>

  <div class="now">
    <div class="lab">Working on now</div>
    <div class="txt" id="now">Loading…</div>
    <div class="nxt">Next up: <b id="next">—</b></div>
  </div>

  <div class="row">
    <div class="stat"><b id="doneCount">0</b><span>Done</span></div>
    <div class="stat"><b id="needCount">0</b><span>Need you</span></div>
    <div class="stat"><b id="liveCount">—</b><span>Live builds</span></div>
  </div>

  <div class="seclabel" id="needLabel" hidden>Needs you</div>
  <div id="needs"></div>

  <div class="seclabel">Recently done</div>
  <div class="feed" id="feed"><div class="item"><div class="body"><b>Loading the latest…</b></div></div></div>

  <div class="links" id="links"></div>
  <footer>Auto-refreshes · the autonomous loop rewrites this every cycle</footer>
</div>

<script>
'use strict';
const KIND={fix:{c:'fix',e:'🔧'},feat:{c:'feat',e:'✦'},deploy:{c:'deploy',e:'▲'},audit:{c:'audit',e:'◎'},docs:{c:'audit',e:'📄'}};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function ago(iso){ if(!iso) return '—'; const d=new Date(iso), s=(Date.now()-d)/1000;
  if(s<90) return 'just now'; if(s<3600) return Math.round(s/60)+'m ago'; if(s<86400) return Math.round(s/3600)+'h ago';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
async function load(){
  try{
    const r=await fetch('./loop-status.json?t='+Date.now()); if(!r.ok) throw new Error('status file not found');
    const d=await r.json();
    document.getElementById('updated').textContent=ago(d.updated);
    document.getElementById('now').textContent=d.now||'Idle';
    document.getElementById('next').textContent=d.next||'—';
    const cycles=d.cycles||[];
    document.getElementById('doneCount').textContent=d.doneTotal||cycles.length;
    document.getElementById('liveCount').textContent=d.liveBuilds||'—';
    const needs=d.needsYou||[];
    document.getElementById('needCount').textContent=needs.length;
    document.getElementById('needLabel').hidden=!needs.length;
    document.getElementById('needs').innerHTML=needs.map(n=>{
      const [t,s]=Array.isArray(n)?n:[n,'']; return `<div class="need"><span class="dot">▹</span><div><b>${esc(t)}</b>${s?`<span>${esc(s)}</span>`:''}</div></div>`;
    }).join('');
    document.getElementById('feed').innerHTML=cycles.slice(0,14).map(c=>{
      const k=KIND[c.kind]||KIND.audit;
      const cm=c.commit?`· <a href="https://github.com/JaredPogue8405/Ai-test.work/commit/${esc(c.commit)}" target="_blank" rel="noopener">${esc(c.commit)}</a>`:'';
      return `<div class="item"><div class="k ${k.c}">${k.e}</div><div class="body"><b>${esc(c.title)}</b><div class="meta">${esc(c.when||'')} ${cm}</div></div></div>`;
    }).join('')||'<div class="item"><div class="body"><b>No cycles yet.</b></div></div>';
    const links=d.links||[];
    document.getElementById('links').innerHTML=links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} →</a>`).join('');
  }catch(e){
    document.getElementById('now').textContent='—';
    document.getElementById('feed').innerHTML='<div class="err">Couldn\'t load status ('+esc(e.message)+'). It refreshes automatically.</div>';
  }
}
load(); setInterval(load, 20000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
window.LoopStatus={reload:load};
</script>
</body>
</html>
