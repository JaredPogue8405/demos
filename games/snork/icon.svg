<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SNORK">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c4220"/>
      <stop offset="0.55" stop-color="#1a2812"/>
      <stop offset="1" stop-color="#101a0b"/>
    </linearGradient>
    <radialGradient id="lantern" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#ffcf3f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffcf3f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="face" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#f9b9d1"/>
      <stop offset="1" stop-color="#e88fb2"/>
    </radialGradient>
  </defs>
  <rect x="40" y="40" width="432" height="432" rx="120" fill="url(#bg)"/>
  <circle cx="256" cy="236" r="190" fill="url(#lantern)"/>
  <!-- ears (tips peek above the face) -->
  <path d="M126 96 L206 92 L182 190 Z" fill="#e07fa6" stroke="#c96f95" stroke-width="8" stroke-linejoin="round"/>
  <path d="M386 96 L306 92 L330 190 Z" fill="#e07fa6" stroke="#c96f95" stroke-width="8" stroke-linejoin="round"/>
  <!-- face -->
  <circle cx="256" cy="258" r="150" fill="url(#face)" stroke="#d97fa6" stroke-width="10"/>
  <!-- eyes -->
  <circle cx="206" cy="232" r="26" fill="#fff"/>
  <circle cx="306" cy="232" r="26" fill="#fff"/>
  <circle cx="214" cy="236" r="13" fill="#2a1a12"/>
  <circle cx="314" cy="236" r="13" fill="#2a1a12"/>
  <!-- snout -->
  <ellipse cx="256" cy="318" rx="86" ry="66" fill="#ffc4dd" stroke="#e08cae" stroke-width="9"/>
  <ellipse cx="230" cy="318" rx="15" ry="24" fill="#b05f83"/>
  <ellipse cx="282" cy="318" rx="15" ry="24" fill="#b05f83"/>
</svg>
