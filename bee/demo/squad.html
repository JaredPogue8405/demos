<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BEE — Squad (multi-agent)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090B; --panel:#131419; --panel-2:#1a1c22; --line:#26282f; --edge:rgba(245,197,24,.28);
    --bee:#F5C518; --bee-bright:#FFD60A; --core-blue:#9FE0FF; --core-deep:#5FB8FF;
    --text:#EDEDEF; --muted:#9aa0ab; --ok:#2fbf71;
    --font:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    --display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
    --mono:'JetBrains Mono','SF Mono','Consolas',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  /* cinematic layers — same language as the main Bee demo */
  .bg-grid,.bg-glow,.vignette,.scan{position:fixed;inset:0;pointer-events:none}
  .bg-grid{z-index:0;background-image:linear-gradient(rgba(245,197,24,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(245,197,24,.03) 1px,transparent 1px);background-size:46px 46px;
    -webkit-mask:radial-gradient(circle at 50% 20%,#000 0%,transparent 72%);mask:radial-gradient(circle at 50% 20%,#000 0%,transparent 72%)}
  .bg-glow{z-index:0;background:radial-gradient(760px 460px at 50% -8%,rgba(95,184,255,.10),transparent 62%),radial-gradient(600px 600px at 50% 120%,rgba(245,197,24,.05),transparent 60%)}
  .vignette{z-index:1;background:radial-gradient(circle at 50% 30%,transparent 55%,rgba(0,0,0,.55))}
  .scan{z-index:1;background:repeating-linear-gradient(transparent 0 3px,rgba(0,0,0,.10) 3px 4px);opacity:.35;mix-blend-mode:multiply}
  .corner{position:fixed;width:26px;height:26px;z-index:2;pointer-events:none;border:2px solid var(--edge)}
  .corner.tl{top:14px;left:14px;border-right:0;border-bottom:0}
  .corner.tr{top:14px;right:14px;border-left:0;border-bottom:0}
  .corner.bl{bottom:14px;left:14px;border-right:0;border-top:0}
  .corner.br{bottom:14px;right:14px;border-left:0;border-top:0}
  :focus-visible{outline:2px solid var(--core-blue);outline-offset:2px}
  .wrap{position:relative;z-index:3;max-width:1040px;margin:0 auto;padding:22px 18px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{font-family:var(--display);font-weight:700;letter-spacing:.2em;color:var(--bee);font-size:18px;text-shadow:0 0 22px rgba(245,197,24,.3)}
  .brand small{color:var(--muted);font-weight:400;letter-spacing:.12em;font-size:11px}
  a.back{font-family:var(--display);color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:.1em;transition:color .2s}
  a.back:hover{color:var(--bee)}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .composer{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;color:var(--text);padding:12px;font-family:var(--font);font-size:15px;resize:vertical;min-height:70px}
  textarea:focus{outline:none;border-color:rgba(245,197,24,.5);box-shadow:0 0 0 3px rgba(245,197,24,.07)}
  .rowb{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
  select{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-family:var(--font);cursor:pointer;transition:border-color .2s}
  select:hover{border-color:var(--edge)}
  button.run{font-family:var(--display);background:linear-gradient(180deg,var(--bee-bright),var(--bee));color:#111;border:none;font-weight:700;letter-spacing:.08em;padding:11px 22px;border-radius:11px;cursor:pointer;
    box-shadow:0 0 0 1px rgba(255,255,255,.15) inset,0 8px 26px rgba(245,197,24,.25);transition:transform .15s,box-shadow .15s}
  button.run:hover{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(255,255,255,.22) inset,0 10px 32px rgba(245,197,24,.4)}
  button.run:disabled{opacity:.5;cursor:default;transform:none}
  .status{font-family:var(--mono);color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-left:auto}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px}
  .dot.live{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .stage{margin-top:22px}
  .lane{margin-top:20px;animation:rise .4s both}
  .lane h3{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .lane h3::before{content:'';width:14px;height:2px;background:var(--bee);box-shadow:0 0 8px rgba(245,197,24,.5)}
  .plan{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:12.5px;white-space:pre-wrap;font-family:var(--mono);line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{position:relative;background:linear-gradient(180deg,#16171c,var(--panel));border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;transition:border-color .25s,box-shadow .25s;animation:rise .4s both}
  .card:hover{border-color:var(--edge);box-shadow:0 10px 34px rgba(0,0,0,.45)}
  .card.working{border-color:rgba(95,184,255,.35);box-shadow:0 0 0 1px rgba(95,184,255,.12),0 10px 30px rgba(0,0,0,.4)}
  .card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .agent{font-family:var(--display);font-weight:700;color:var(--bee);letter-spacing:.06em;font-size:13.5px;text-transform:uppercase}
  .pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
  .pill.running{color:var(--core-blue);border-color:rgba(95,184,255,.4);animation:pulse 1.6s infinite}
  .pill.done{color:var(--ok);border-color:rgba(47,191,113,.4)}
  .goal{font-family:var(--mono);color:var(--muted);font-size:11px;margin-bottom:8px;line-height:1.5}
  .out{font-size:13.5px;line-height:1.5;white-space:pre-wrap}
  .synth{background:linear-gradient(160deg,#191a1f,#141519);border:1px solid rgba(245,197,24,.35);box-shadow:0 0 40px rgba(245,197,24,.06)}
  .synth .agent{color:var(--core-blue)}
  .cursor{display:inline-block;width:7px;height:14px;background:var(--core-blue);vertical-align:-2px;box-shadow:0 0 8px var(--core-blue);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .err{color:#ff9a9b;font-size:13px;margin-top:10px}
  .hint{font-family:var(--mono);color:#5b606b;font-size:11px;margin-top:14px;line-height:1.6;letter-spacing:.02em}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  @media(max-width:620px){.corner{display:none}}

  /* ===== AGENTS-v09-compliance — adopted from ui-ux-pro-max (P2 Touch & Interaction = CRITICAL) =====
     Every real control gets a >=44x44 tap area and >=8px separation. Visual language is
     unchanged: min-height/min-width grow the hit box, they don't restyle anything.
     Deliberately NOT using a blanket ::after — several demos already use ::after for
     tooltips and sheen, and overwriting those would be a regression. */
  html{touch-action:manipulation}                 /* kills the 300ms mobile tap delay */
  /* NOTE: input[type="text"] misses inputs with NO type attribute — use :not() form. */
  button, select, textarea,
  input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="range"]),
  [role="button"], [role="checkbox"], [onclick]{ min-height:44px }
  button, select, [role="button"], [onclick]{ min-width:44px }
  /* anchor-based controls (links used as buttons) — text links in prose are exempt */
  a.back, a.btn, .srow a, .navrow a, .factions a, .dactions a, .samples a, .ric,
  a.card, a[role="button"]{ min-height:44px; display:inline-flex; align-items:center }
  /* icon-only controls: keep the glyph small, grow the target */
  .mic, .iconbtn, .fav, .x, .rf{ min-width:44px; min-height:44px }
  /* custom toggles keep their visual size; the wrapping label carries the target */
  .switch, label:has(> input[type="checkbox"]){ min-height:44px; display:inline-flex; align-items:center }
  /* adjacent controls need >=8px between them */
  .navrow, .samples, .tabs, .rowb, .controls, .factions, .dactions, .heroactions, .hrow{ gap:8px }
  /* P6 Typography: tabular figures so live numbers never shift layout */
  .mono, .telemetry, .stat, .kv, .cdist, .conf, .meta, .pill, .clockbox, .ms{ font-variant-numeric:tabular-nums }
</style>
</head>
<body>
<div class="bg-grid"></div><div class="bg-glow"></div><div class="vignette"></div><div class="scan"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="wrap">
  <header>
    <div class="brand">BEE · SQUAD <small>multi-agent</small></div>
    <a class="back" href="index.html">◀ BEE CHAT</a>
  </header>
  <div class="sub">Give Bee a task. A <b>planner</b> breaks it into independent subtasks, <b>worker agents</b> run them in parallel on Ollama, and a <b>synthesizer</b> merges the results.</div>

  <div class="composer">
    <textarea id="task" placeholder="e.g. Plan a launch for a local food-allergy scanner app: positioning, a 5-tweet thread, and 3 risks with mitigations.">Plan a launch for a local food-allergy scanner app: give me positioning, a 5-tweet launch thread, and the 3 biggest risks with mitigations.</textarea>
    <div class="rowb">
      <select id="model"><option>connecting…</option></select>
      <button class="run" id="runBtn" onclick="runSquad()">RUN SQUAD</button>
      <span class="status"><span class="dot" id="dot"></span><span id="statusText">checking Ollama…</span></span>
    </div>
  </div>

  <div class="stage" id="stage"></div>
  <div class="hint" id="hint"></div>
</div>

<script>
const OLLAMA_BASE='http://localhost:11434';
const stage=document.getElementById('stage'), statusText=document.getElementById('statusText'), dot=document.getElementById('dot');
let MODELS=[];

async function detect(){
  try{
    const r=await fetch(OLLAMA_BASE+'/api/tags'); if(!r.ok) throw 0;
    const d=await r.json(); MODELS=(d.models||[]).map(m=>m.name);
    if(!MODELS.length) throw 0;
    document.getElementById('model').innerHTML=MODELS.map(n=>`<option>${n}</option>`).join('');
    // prefer a fast local TEXT model by default (skip cloud, vision, embed)
    const chatty=n=>!/:cloud$/.test(n)&&!/llava|embed|vision/i.test(n);
    const local=MODELS.find(n=>chatty(n)&&/(:8b|:7b|:3b|mini|small)/i.test(n)) || MODELS.find(chatty) || MODELS[0];
    if(local) document.getElementById('model').value=local;
    dot.classList.add('live'); statusText.textContent='Ollama connected · '+MODELS.length+' models';
    return true;
  }catch(e){ statusText.textContent='Ollama not reachable — start it and reload'; return false; }
}
detect();

// Minimal streaming chat. onTok(token) called per chunk; returns full text.
async function chat(model,messages,onTok){
  const res=await fetch(OLLAMA_BASE+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model,messages,stream:true})});
  if(!res.ok||!res.body) throw new Error('HTTP '+res.status+(res.status===403?' (cloud model needs a paid Ollama plan — pick a local model)':''));
  const rd=res.body.getReader(), dec=new TextDecoder(); let buf='',full='';
  for(;;){ const {done,value}=await rd.read(); if(done) break;
    buf+=dec.decode(value,{stream:true}); const lines=buf.split('\n'); buf=lines.pop();
    for(const ln of lines){ const s=ln.trim(); if(!s) continue;
      try{ const j=JSON.parse(s); const p=(j.message&&j.message.content)||''; if(p){ full+=p; onTok&&onTok(p,full); } }catch(e){}
    }
  }
  return full;
}

function extractJSON(text){
  const fence=text.match(/```(?:json)?\s*([\s\S]*?)```/i); const raw=fence?fence[1]:text;
  const s=raw.indexOf('{'), e=raw.lastIndexOf('}');
  if(s<0||e<0) throw new Error('planner returned no JSON');
  return JSON.parse(raw.slice(s,e+1));
}

const PLANNER="You are Bee's PLANNER. Break the user's task into 2 to 4 INDEPENDENT subtasks that different agents can do in parallel (no subtask depends on another). Output ONLY valid JSON, no prose, no code fence:\n{\"subtasks\":[{\"id\":1,\"agent\":\"short role e.g. Researcher\",\"goal\":\"one concrete instruction\"}]}";
const worker=(agent,goal,task)=>`You are the ${agent} agent on Bee's squad, working on ONE part of a larger task.\nOverall task (context): ${task}\nYOUR job, and only this: ${goal}\nBe concise and produce only your part — do not restate the whole task or other agents' work.`;
const SYNTH="You are Bee's SYNTHESIZER. Merge the squad's subtask results into one cohesive, well-structured final answer for the user. Remove overlap, keep it tight and useful. Lead with the result.";

function laneEl(title){ const l=document.createElement('div'); l.className='lane'; l.innerHTML=`<h3>${title}</h3>`; stage.appendChild(l); return l; }

async function runSquad(){
  stage.innerHTML=''; document.getElementById('hint').textContent='';
  const task=document.getElementById('task').value.trim(); if(!task) return;
  const model=document.getElementById('model').value;
  const btn=document.getElementById('runBtn'); btn.disabled=true;
  const t0=performance.now();
  try{
    // 1) PLAN
    const planLane=laneEl('1 · Planner'); const planBox=document.createElement('div'); planBox.className='plan'; planBox.innerHTML='<span class="cursor"></span>'; planLane.appendChild(planBox);
    const planText=await chat(model,[{role:'system',content:PLANNER},{role:'user',content:task}],(_,full)=>{ planBox.textContent=full; });
    let plan; try{ plan=extractJSON(planText); }catch(e){ planBox.innerHTML='<span class="err">Planner did not return usable JSON. Try again or a stronger model.</span>'; throw e; }
    const subtasks=(plan.subtasks||[]).slice(0,4);
    planBox.textContent=subtasks.map(s=>`• [${s.agent}] ${s.goal}`).join('\n');

    // 2) WORKERS (parallel)
    const wLane=laneEl(`2 · Workers (${subtasks.length} running in parallel)`); const grid=document.createElement('div'); grid.className='grid'; wLane.appendChild(grid);
    const results=await Promise.all(subtasks.map(async st=>{
      const card=document.createElement('div'); card.className='card working';
      card.innerHTML=`<div class="top"><span class="agent">${st.agent}</span><span class="pill running">running</span></div><div class="goal">${st.goal}</div><div class="out"><span class="cursor"></span></div>`;
      grid.appendChild(card);
      const out=card.querySelector('.out'), pill=card.querySelector('.pill');
      try{
        const text=await chat(model,[{role:'system',content:worker(st.agent,st.goal,task)},{role:'user',content:st.goal}],(_,full)=>{ out.textContent=full; });
        pill.textContent='done'; pill.className='pill done'; card.classList.remove('working');
        return {agent:st.agent,goal:st.goal,text};
      }catch(e){ out.innerHTML='<span class="err">'+e+'</span>'; pill.textContent='error'; card.classList.remove('working'); return {agent:st.agent,goal:st.goal,text:'(failed)'}; }
    }));

    // 3) SYNTHESIZE
    const sLane=laneEl('3 · Synthesizer'); const sCard=document.createElement('div'); sCard.className='card synth';
    sCard.innerHTML=`<div class="top"><span class="agent">Bee · final</span><span class="pill running">merging</span></div><div class="out"><span class="cursor"></span></div>`;
    sLane.appendChild(sCard); const sOut=sCard.querySelector('.out'), sPill=sCard.querySelector('.pill');
    const bundle=results.map(r=>`### ${r.agent} — ${r.goal}\n${r.text}`).join('\n\n');
    await chat(model,[{role:'system',content:SYNTH},{role:'user',content:`Task: ${task}\n\nSquad results:\n${bundle}`}],(_,full)=>{ sOut.textContent=full; });
    sPill.textContent='done'; sPill.className='pill done';

    document.getElementById('hint').textContent=`Done in ${((performance.now()-t0)/1000).toFixed(1)}s · model ${model} · ${subtasks.length} agents ran concurrently. Real parallelism scales with your GPU (OLLAMA_NUM_PARALLEL).`;
  }catch(e){
    const d=document.createElement('div'); d.className='err'; d.textContent='Squad error: '+e; stage.appendChild(d);
  }finally{ btn.disabled=false; }
}
</script>
<script src="shell.js"></script>
</body>
</html>
