<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#1a1d24;--paper:#f7f5f0;--gold:#c88a2a;--muted:#6b7280}
  body{background:var(--paper);color:var(--ink);min-height:100dvh;display:grid;place-items:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;padding:28px}
  .card{width:min(420px,92vw);background:#fff;border:1px solid #e6e0d4;border-radius:26px;padding:34px 30px 28px;
    text-align:center;box-shadow:0 30px 70px -34px rgba(26,29,36,.4)}
  .kicker{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:700}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
  p{color:var(--muted);font-size:14.5px;line-height:1.55;margin-top:8px}
  .qrbox{margin:22px auto 14px;width:min(280px,72vw);aspect-ratio:1;border:12px solid #fff;border-radius:16px;
    box-shadow:0 0 0 1px #e6e0d4,0 16px 34px -18px rgba(26,29,36,.4);background:#fff}
  .qrbox img{width:100%;height:100%;display:block;border-radius:6px;image-rendering:pixelated}
  .how{display:flex;gap:12px;justify-content:center;margin-top:6px;color:var(--muted);font-size:12.5px}
  .how b{color:var(--ink)}
  .url{margin-top:16px;font-size:11px;color:#9aa0a8;word-break:break-all;font-family:ui-monospace,Consolas,monospace}
  .print{margin-top:20px;border:none;background:var(--ink);color:#fff;font:inherit;font-size:14px;font-weight:600;
    padding:13px 26px;border-radius:999px;cursor:pointer}
  @media print{body{background:#fff}.card{box-shadow:none;border:none}.print{display:none}@page{margin:16mm}}
</style>
</head>
